<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152c2b">
  <meta name="description" content="龍行江湖：挑戰 2.5 倍速，穿越四處江湖勝景的小恐龍跑酷遊戲。">
  <title>龍行江湖｜小恐龍跑酷</title>
  <link rel="icon" href="assets/prism-dino.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --ink: #f5f2e7;
      --muted: #b6c6bd;
      --line: rgba(221, 233, 213, .18);
      --panel: rgba(22, 45, 43, .86);
      --mint: #b8d6a1;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(89, 138, 111, .27), transparent 33rem),
        radial-gradient(circle at 90% 85%, rgba(204, 167, 105, .12), transparent 34rem),
        #0d211f;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, canvas:focus-visible { outline: 3px solid #e9ce8d; outline-offset: 4px; }
    .app { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 30px; }
    .topbar, .brand, .top-actions, .scoreboard, .controls, .control { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .brand { gap: 14px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 52px; height: 52px; flex: none;
      border-radius: 16px; box-shadow: 0 10px 24px rgba(3, 5, 21, .25);
    }
    .brand-mark img { width: 52px; height: 52px; object-fit: contain; }
    .eyebrow { margin: 0 0 2px; font-size: .67rem; letter-spacing: .22em; font-weight: 800; color: var(--mint); }
    h1 { margin: 0; font-size: clamp(1.25rem, 2.6vw, 1.9rem); line-height: 1.18; letter-spacing: .04em; }
    .top-actions { gap: 9px; }
    .icon-btn {
      border: 1px solid var(--line); color: var(--ink); background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(12px); border-radius: 999px; min-height: 39px;
    }
    .icon-btn { padding: 0 16px; font-weight: 700; transition: background .2s, transform .2s; }
    .icon-btn .audio-label { margin-left: 5px; }
    .icon-btn:hover, .control:hover { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }
    .icon-btn:disabled { opacity: .48; cursor: default; transform: none; }
    .game-card {
      position: relative; overflow: hidden; border-radius: 28px;
      border: 1px solid rgba(210, 225, 203, .24);
      box-shadow: 0 26px 80px rgba(3, 5, 24, .36), inset 0 1px rgba(255, 255, 255, .12);
      background: #2d504d;
    }
    .stage { position: relative; height: clamp(370px, 57vh, 565px); min-height: 370px; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    .scoreboard {
      position: absolute; z-index: 2; top: 18px; left: 18px; right: 18px;
      display: grid; grid-template-columns: max-content max-content 184px minmax(0, 1fr);
      grid-template-areas: "current best skill speed" ". . . scene";
      align-items: start; gap: 8px; pointer-events: none;
    }
    .score-current { grid-area: current; }
    .score-best { grid-area: best; }
    .score-chip {
      min-width: 94px; padding: 9px 13px; border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 14px; background: rgba(14, 38, 36, .49); backdrop-filter: blur(9px);
    }
    .score-chip small { display: block; color: #d8e3d4; font-size: .69rem; letter-spacing: .08em; }
    .score-chip strong { display: block; margin-top: 1px; font-size: 1.2rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .speed-chip { grid-area: speed; justify-self: end; min-width: 82px; text-align: right; }
    .skill-badge {
      grid-area: skill; width: 184px;
      padding: 8px 11px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      color: #f7f5ed; background: rgba(14, 38, 36, .55); backdrop-filter: blur(9px);
      font-size: .74rem; font-weight: 750; pointer-events: none;
    }
    .skill-badge.ready { color: #c6e5aa; }
    .skill-badge.active { color: #ffe59a; }
    .skill-badge.usable { animation: skill-card-pulse 1.2s ease-in-out infinite; }
    @keyframes skill-card-pulse {
      0%, 100% { border-color: rgba(190, 231, 173, .38); background-color: rgba(14, 38, 36, .55); box-shadow: 0 0 0 rgba(169, 229, 170, 0); }
      50% { border-color: rgba(217, 246, 190, .86); background-color: rgba(28, 69, 53, .74); box-shadow: 0 0 15px rgba(169, 229, 170, .28); }
    }
    .skill-head { display: flex; align-items: baseline; justify-content: space-between; gap: 7px; }
    .skill-head span { white-space: nowrap; }
    .skill-remaining { color: #f7f5ed; font-variant-numeric: tabular-nums; }
    .skill-track { height: 7px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.16); }
    .skill-fill { display: block; width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #78c4a7, #d9e9a7); }
    .skill-effect { min-height: 1.1em; margin-top: 4px; color: #ffe59a; font-size: .69rem; }
    .scene-badge {
      grid-area: scene; justify-self: end;
      padding: 8px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px;
      color: #fff0d1; background: rgba(14, 38, 36, .62); backdrop-filter: blur(9px);
      font-size: .77rem; font-weight: 800; pointer-events: none;
    }
    .toast {
      position: absolute; z-index: 4; left: 50%; bottom: 15px; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 28px); padding: 11px 18px;
      border: 1px solid rgba(255,230,161,.45); border-radius: 999px;
      color: #fff4d4; background: rgba(25, 48, 43, .94);
      box-shadow: 0 12px 30px rgba(4, 6, 25, .24); text-align: center;
      font-size: .84rem; font-weight: 800; pointer-events: none;
    }
    .overlay {
      position: absolute; z-index: 3; inset: 0; display: grid; place-items: center;
      padding: 76px 20px 38px; background: linear-gradient(180deg, rgba(12, 35, 33, .1), rgba(12, 35, 33, .69));
    }
    [hidden] { display: none !important; }
    .modal {
      width: min(440px, 100%); padding: clamp(21px, 4vw, 34px); text-align: center;
      border: 1px solid rgba(255, 255, 255, .22); border-radius: 25px;
      background: rgba(22, 45, 42, .93); backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(2, 4, 22, .3);
    }
    .modal-icon { display: inline-grid; place-items: center; width: 55px; height: 55px; font-size: 1.9rem; border-radius: 18px; background: rgba(255, 255, 255, .09); }
    .modal h2 { margin: 15px 0 8px; font-size: clamp(1.55rem, 4vw, 2.1rem); letter-spacing: .03em; }
    .modal p { margin: 0 auto 21px; max-width: 33ch; color: #d4e0d5; font-size: .93rem; line-height: 1.75; }
    .final-score { display: flex; justify-content: center; gap: 30px; margin: -4px 0 22px; }
    .final-score span { color: var(--muted); font-size: .78rem; }
    .final-score strong { display: block; color: #fff; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
    .primary {
      min-width: 178px; min-height: 48px; padding: 10px 25px; border: 0; border-radius: 13px;
      color: #1b3430; background: linear-gradient(105deg, #efd39a, #afd5ad);
      font-weight: 900; box-shadow: 0 9px 25px rgba(181, 214, 159, .19);
      transition: transform .2s, filter .2s;
    }
    .primary:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .game-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 18px; background: rgba(17, 41, 39, .8); }
    .hint { margin: 0; color: #c7d6c7; font-size: .83rem; line-height: 1.6; }
    kbd { display: inline-block; min-width: 24px; padding: 1px 6px; border: 1px solid rgba(255,255,255,.26); border-bottom-width: 2px; border-radius: 5px; color: #fff; text-align: center; font: inherit; font-size: .75rem; }
    .controls { display: none; gap: 10px; width: 100%; }
    .control { justify-content: center; gap: 8px; min-height: 58px; flex: 1; border-radius: 13px; border: 1px solid rgba(255,255,255,.18); color: #fff; background: rgba(255,255,255,.08); font-weight: 800; touch-action: none; user-select: none; }
    .control:active { transform: translateY(2px); background: rgba(255,255,255,.19); }
    .control:disabled { cursor: default; opacity: .58; transform: none; }
    .control.skill-ready { color: #f3dda5; border-color: rgba(241,211,151,.55); }
    .control.skill-ready { animation: skill-button-pulse 1.2s ease-in-out infinite; }
    @keyframes skill-button-pulse {
      0%, 100% { border-color: rgba(241, 211, 151, .55); background-color: rgba(255, 255, 255, .08); box-shadow: 0 0 0 rgba(241, 211, 151, 0); }
      50% { border-color: rgba(255, 233, 181, .95); background-color: rgba(241, 211, 151, .18); box-shadow: 0 0 15px rgba(241, 211, 151, .27); }
    }
    .collection {
      margin-top: 24px; padding: clamp(20px, 3vw, 30px);
      border: 1px solid var(--line); border-radius: 24px;
      background: rgba(21, 45, 42, .82); box-shadow: 0 18px 45px rgba(4, 16, 14, .18);
    }
    .collection-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .collection h2 { margin: 0; font-size: 1.35rem; }
    .collection-head p, .collection-note { margin: 0; color: var(--muted); font-size: .83rem; line-height: 1.65; }
    .collection h3 { margin: 26px 0 12px; font-size: .98rem; letter-spacing: .04em; }
    .skin-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .skin-card, .achievement-card {
      min-width: 0; border: 1px solid rgba(222, 234, 213, .16); border-radius: 17px;
      background: rgba(255, 255, 255, .055);
    }
    .skin-card { padding: 16px; }
    .skin-card.selected { border-color: rgba(184, 214, 161, .72); background: rgba(149, 193, 140, .12); }
    .skin-card.locked { opacity: .67; }
    .skin-portrait {
      display: grid; place-items: center; width: 68px; height: 68px; margin-bottom: 12px;
      border-radius: 19px; background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.03));
    }
    .skin-portrait svg { width: 53px; height: 53px; }
    .skin-card h4, .achievement-card h4 { margin: 0; font-size: .94rem; }
    .skin-card p { min-height: 3.2em; margin: 6px 0 12px; color: #d0d9cd; font-size: .76rem; line-height: 1.6; }
    .skin-card button {
      width: 100%; min-height: 36px; border: 1px solid rgba(255,255,255,.24); border-radius: 9px;
      color: #fff; background: rgba(255,255,255,.08); font-size: .78rem; font-weight: 800;
    }
    .skin-card button:not(:disabled):hover { background: rgba(180, 213, 159, .21); }
    .skin-card button:disabled { cursor: default; opacity: .78; }
    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .achievement-card { display: flex; align-items: flex-start; gap: 11px; padding: 13px; }
    .achievement-card.done { border-color: rgba(255, 226, 148, .43); }
    .achievement-symbol { display: grid; place-items: center; width: 35px; height: 35px; flex: none; border-radius: 10px; background: rgba(255,255,255,.09); font-size: 1rem; }
    .achievement-card.done .achievement-symbol { background: rgba(255, 224, 143, .18); }
    .achievement-card p { margin: 3px 0 0; color: #d0d9cd; font-size: .76rem; line-height: 1.55; }
    .achievement-card small { display: block; margin-top: 5px; color: #c3e1ae; font-size: .72rem; }
    .progress-track { overflow: hidden; height: 4px; margin-top: 9px; border-radius: 4px; background: rgba(255,255,255,.12); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #eaca87, #9bc997); }
    .footer { padding: 18px 5px 0; color: #a8c2af; font-size: .77rem; }
    .footer p { margin: 0; }
    @media (max-width: 760px) {
      .app { width: min(calc(100% - 20px), 540px); padding-top: 14px; }
      .topbar { gap: 8px; margin-bottom: 14px; }
      .brand { gap: 9px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 12px; }
      .brand-mark img { width: 40px; height: 40px; }
      .eyebrow { font-size: .56rem; }
      .icon-btn { padding: 0 10px; font-size: .82rem; min-height: 44px; }
      .audio-btn { min-width: 44px; padding: 0; font-size: 1.1rem; }
      .audio-btn .audio-label { display: none; }
      .game-card { border-radius: 20px; }
      .stage { height: clamp(390px, 59vh, 510px); }
      .scoreboard {
        top: 12px; left: 11px; right: 11px; gap: 5px;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(126px, 1.6fr);
        grid-template-areas: "current best skill" "speed . scene";
      }
      .score-chip { min-width: 0; padding: 7px 6px; border-radius: 10px; }
      .score-chip strong { font-size: 1rem; }
      .score-chip small { font-size: .62rem; }
      .speed-chip { min-width: 0; justify-self: start; }
      .skill-badge { width: 100%; padding: 6px 9px; font-size: .67rem; }
      .skill-head { flex-wrap: wrap; gap: 1px 5px; }
      .skill-remaining { margin-left: auto; }
      .skill-effect { font-size: .64rem; }
      .scene-badge { padding: 6px 9px; font-size: .69rem; }
      .overlay { padding: 70px 15px 25px; }
      .game-tools { padding: 10px; }
      .hint { display: none; }
      .controls { display: flex; }
      .control { gap: 3px; min-height: 54px; font-size: .82rem; }
      .collection { margin-top: 16px; padding: 17px; border-radius: 19px; }
      .skin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .skin-card { padding: 11px; }
      .achievement-grid { grid-template-columns: 1fr; }
      .footer { line-height: 1.6; }
    }
    @media (max-width: 420px) {
      .brand { gap: 7px; }
      .brand-mark, .brand-mark img { width: 32px; height: 32px; }
      .eyebrow { font-size: .5rem; letter-spacing: .1em; }
      h1 { font-size: 1.05rem; }
      .top-actions { gap: 5px; }
      #pauseButton { padding: 0 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .skill-badge.usable { animation: none !important; border-color: rgba(217, 246, 190, .86); background-color: rgba(28, 69, 53, .7); box-shadow: 0 0 0 2px rgba(169, 229, 170, .2); }
      .control.skill-ready { animation: none !important; border-color: rgba(255, 233, 181, .95); background-color: rgba(241, 211, 151, .16); box-shadow: 0 0 0 2px rgba(241, 211, 151, .2); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/prism-dino.svg" alt=""></div>
        <div><p class="eyebrow">DRAGON'S JOURNEY</p><h1>龍行江湖</h1></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn audio-btn" id="musicButton" type="button" aria-pressed="true" aria-label="背景音樂已開啟，按下關閉"><span aria-hidden="true">♬</span><span class="audio-label">音樂開啟</span></button>
        <button class="icon-btn audio-btn" id="soundButton" type="button" aria-pressed="true" aria-label="音效已開啟，按下關閉"><span aria-hidden="true">♪</span><span class="audio-label">音效開啟</span></button>
        <button class="icon-btn" id="pauseButton" type="button" disabled>暫停</button>
      </div>
    </header>

    <section class="game-card" aria-label="龍行江湖小恐龍跑酷遊戲">
      <div class="stage" id="stage">
        <canvas id="gameCanvas" tabindex="0" aria-label="遊戲畫面，按空白鍵跳躍，按住下方向鍵蹲下"></canvas>
        <div class="scoreboard" aria-label="遊戲資訊">
          <div class="score-chip score-current"><small>目前分數</small><strong id="score">0000</strong></div>
          <div class="score-chip score-best"><small>最高分</small><strong id="best">0000</strong></div>
          <div class="skill-badge ready" id="skillStatus">
            <div class="skill-head"><span id="skillName">凌風身法</span><span class="skill-remaining" id="skillRemaining">可使用</span></div>
            <div class="skill-track" id="skillProgress" role="progressbar" aria-label="技能冷卻進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-valuetext="冷卻完成，可使用"><span class="skill-fill" id="skillFill"></span></div>
            <div class="skill-effect" id="skillEffect"></div>
          </div>
          <div class="score-chip speed-chip"><small>速度</small><strong id="speed">×1.0</strong></div>
          <div class="scene-badge" aria-live="polite">場景 · <span id="sceneName">青竹山徑</span></div>
        </div>
        <div class="toast" id="achievementToast" role="status" aria-live="polite" hidden></div>
        <div class="overlay" id="overlay" aria-live="polite">
          <div class="modal">
            <span class="modal-icon" id="modalIcon" aria-hidden="true">⚔</span>
            <h2 id="modalTitle">準備闖蕩江湖了嗎？</h2>
            <p id="modalDescription">躍過路障、蹲下閃開飛行障礙，穿越四處江湖勝景。</p>
            <div class="final-score" id="finalScore" hidden>
              <div><span>本次分數</span><strong id="runScore">0</strong></div>
              <div><span>最高分</span><strong id="runBest">0</strong></div>
            </div>
            <button class="primary" id="mainButton" type="button">開始遊戲 →</button>
          </div>
        </div>
      </div>
      <div class="game-tools">
        <p class="hint"><kbd>空白鍵</kbd>／<kbd>↑</kbd> 跳躍　·　按住 <kbd>↓</kbd> 蹲下　·　<kbd>Shift</kbd>／<kbd>X</kbd> 技能　·　<kbd>P</kbd> 暫停</p>
        <div class="controls" aria-label="觸控操作">
          <button class="control" id="duckButton" type="button" aria-label="按住蹲下">↓ 蹲下</button>
          <button class="control" id="skillButton" type="button" aria-label="發動技能">✦ 技能</button>
          <button class="control" id="jumpButton" type="button" aria-label="跳躍">↑ 跳躍</button>
        </div>
      </div>
    </section>
    <section class="collection" aria-labelledby="collectionTitle">
      <div class="collection-head"><h2 id="collectionTitle">江湖圖鑑</h2><p>完成挑戰，解鎖新的小恐龍與主動技能。</p></div>
      <h3>角色造型</h3>
      <div class="skin-grid" id="skinGrid"></div>
      <h3>八個成就</h3>
      <div class="achievement-grid" id="achievementGrid"></div>
      <p class="collection-note" id="collectionNote">選擇造型後，從下一局開始使用；所有造型共用最高分。</p>
    </section>
    <footer class="footer"><p>每 500 分切換場景；右側的 ↑／↓ 提示下一個障礙。</p></footer>
  </main>

  <audio id="milestoneSound" preload="auto" src="assets/90s-game-ui.mp3"></audio>
  <audio id="hitSound" preload="auto" src="assets/negative_beeps.mp3"></audio>
  <audio id="jumpSound" preload="auto" src="assets/jump.mp3"></audio>
  <audio id="duckSound" preload="auto" src="assets/air-blow5.mp3"></audio>
  <audio id="skillSound" preload="auto" src="assets/skill.mp3"></audio>
  <audio id="musicA" preload="auto" src="assets/game%20music.mp3"></audio>
  <audio id="musicB" preload="auto" src="assets/game%20music.mp3"></audio>
  <script src="game.js" defer></script>
</body>
</html>
