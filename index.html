<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a35">
  <meta name="description" content="虹光衝刺：挑戰 2.5 倍速，穿越四個場景的彩虹小恐龍跑酷遊戲。">
  <title>虹光衝刺｜彩虹小恐龍</title>
  <link rel="icon" href="assets/prism-dino.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      --ink: #f6f5ff;
      --muted: #b8b9d5;
      --line: rgba(224, 224, 255, .17);
      --panel: rgba(29, 32, 64, .82);
      --mint: #77e8c8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(120, 106, 216, .28), transparent 33rem),
        radial-gradient(circle at 90% 85%, rgba(66, 180, 191, .13), transparent 34rem),
        #11142b;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, canvas:focus-visible { outline: 3px solid #ffe093; outline-offset: 4px; }
    .app { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 30px; }
    .topbar, .brand, .top-actions, .scoreboard, .controls, .control { display: flex; align-items: center; }
    .topbar { justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .brand { gap: 14px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center; width: 52px; height: 52px; flex: none;
      border-radius: 16px; box-shadow: 0 10px 24px rgba(3, 5, 21, .25);
    }
    .brand-mark img { width: 52px; height: 52px; object-fit: contain; }
    .eyebrow { margin: 0 0 2px; font-size: .67rem; letter-spacing: .22em; font-weight: 800; color: var(--mint); }
    h1 { margin: 0; font-size: clamp(1.25rem, 2.6vw, 1.9rem); line-height: 1.18; letter-spacing: .04em; }
    .top-actions { gap: 9px; }
    .icon-btn {
      border: 1px solid var(--line); color: var(--ink); background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(12px); border-radius: 999px; min-height: 39px;
    }
    .icon-btn { padding: 0 16px; font-weight: 700; transition: background .2s, transform .2s; }
    .icon-btn:hover, .control:hover { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }
    .icon-btn:disabled { opacity: .48; cursor: default; transform: none; }
    .game-card {
      position: relative; overflow: hidden; border-radius: 28px;
      border: 1px solid rgba(214, 213, 255, .22);
      box-shadow: 0 26px 80px rgba(3, 5, 24, .36), inset 0 1px rgba(255, 255, 255, .12);
      background: #292a56;
    }
    .stage { position: relative; height: clamp(370px, 57vh, 565px); min-height: 370px; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    .scoreboard {
      position: absolute; z-index: 2; top: 18px; left: 18px; right: 18px; gap: 8px;
      pointer-events: none; flex-wrap: wrap;
    }
    .score-chip {
      min-width: 94px; padding: 9px 13px; border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 14px; background: rgba(17, 19, 47, .38); backdrop-filter: blur(9px);
    }
    .score-chip small { display: block; color: #d3d3ef; font-size: .69rem; letter-spacing: .08em; }
    .score-chip strong { display: block; margin-top: 1px; font-size: 1.2rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .speed-chip { margin-left: auto; min-width: 82px; text-align: right; }
    .skill-badge {
      position: absolute; z-index: 2; top: 90px; right: 18px; min-width: 145px;
      padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 12px;
      color: #f7f5ff; background: rgba(22, 23, 54, .48); backdrop-filter: blur(9px);
      text-align: right; font-size: .77rem; font-weight: 750; pointer-events: none;
    }
    .skill-badge.ready { color: #9df0d1; }
    .skill-badge.active { color: #ffe59a; }
    .scene-badge {
      position: absolute; z-index: 2; top: 90px; left: 18px;
      padding: 8px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px;
      color: #fff5d7; background: rgba(22, 23, 54, .58); backdrop-filter: blur(9px);
      font-size: .77rem; font-weight: 800; pointer-events: none;
    }
    .toast {
      position: absolute; z-index: 4; left: 50%; bottom: 15px; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 28px); padding: 11px 18px;
      border: 1px solid rgba(255,230,161,.45); border-radius: 999px;
      color: #fff7d4; background: rgba(31, 31, 65, .92);
      box-shadow: 0 12px 30px rgba(4, 6, 25, .24); text-align: center;
      font-size: .84rem; font-weight: 800; pointer-events: none;
    }
    .overlay {
      position: absolute; z-index: 3; inset: 0; display: grid; place-items: center;
      padding: 76px 20px 38px; background: linear-gradient(180deg, rgba(14, 17, 42, .08), rgba(14, 17, 42, .63));
    }
    [hidden] { display: none !important; }
    .modal {
      width: min(440px, 100%); padding: clamp(21px, 4vw, 34px); text-align: center;
      border: 1px solid rgba(255, 255, 255, .22); border-radius: 25px;
      background: rgba(24, 27, 60, .9); backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(2, 4, 22, .3);
    }
    .modal-icon { display: inline-grid; place-items: center; width: 55px; height: 55px; font-size: 1.9rem; border-radius: 18px; background: rgba(255, 255, 255, .09); }
    .modal h2 { margin: 15px 0 8px; font-size: clamp(1.55rem, 4vw, 2.1rem); letter-spacing: .03em; }
    .modal p { margin: 0 auto 21px; max-width: 33ch; color: #d4d5ed; font-size: .93rem; line-height: 1.75; }
    .final-score { display: flex; justify-content: center; gap: 30px; margin: -4px 0 22px; }
    .final-score span { color: var(--muted); font-size: .78rem; }
    .final-score strong { display: block; color: #fff; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
    .primary {
      min-width: 178px; min-height: 48px; padding: 10px 25px; border: 0; border-radius: 13px;
      color: #172035; background: linear-gradient(105deg, #ffe59a, #8df3cf);
      font-weight: 900; box-shadow: 0 9px 25px rgba(82, 231, 194, .19);
      transition: transform .2s, filter .2s;
    }
    .primary:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .game-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 18px; background: rgba(15, 17, 45, .72); }
    .hint { margin: 0; color: #c8c9e1; font-size: .83rem; line-height: 1.6; }
    kbd { display: inline-block; min-width: 24px; padding: 1px 6px; border: 1px solid rgba(255,255,255,.26); border-bottom-width: 2px; border-radius: 5px; color: #fff; text-align: center; font: inherit; font-size: .75rem; }
    .controls { display: none; gap: 10px; width: 100%; }
    .control { justify-content: center; gap: 8px; min-height: 58px; flex: 1; border-radius: 13px; border: 1px solid rgba(255,255,255,.18); color: #fff; background: rgba(255,255,255,.08); font-weight: 800; touch-action: none; user-select: none; }
    .control:active { transform: translateY(2px); background: rgba(255,255,255,.19); }
    .control:disabled { cursor: default; opacity: .58; transform: none; }
    .control.skill-ready { color: #ffeba8; border-color: rgba(255,230,161,.55); }
    .collection {
      margin-top: 24px; padding: clamp(20px, 3vw, 30px);
      border: 1px solid var(--line); border-radius: 24px;
      background: rgba(27, 29, 62, .76); box-shadow: 0 18px 45px rgba(4, 6, 24, .16);
    }
    .collection-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .collection h2 { margin: 0; font-size: 1.35rem; }
    .collection-head p, .collection-note { margin: 0; color: var(--muted); font-size: .83rem; line-height: 1.65; }
    .collection h3 { margin: 26px 0 12px; font-size: .98rem; letter-spacing: .04em; }
    .skin-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .skin-card, .achievement-card {
      min-width: 0; border: 1px solid rgba(229, 230, 255, .13); border-radius: 17px;
      background: rgba(255, 255, 255, .055);
    }
    .skin-card { padding: 16px; }
    .skin-card.selected { border-color: rgba(155, 239, 209, .72); background: rgba(123, 229, 198, .1); }
    .skin-card.locked { opacity: .67; }
    .skin-portrait {
      display: grid; place-items: center; width: 68px; height: 68px; margin-bottom: 12px;
      border-radius: 19px; background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.03));
    }
    .skin-portrait svg { width: 53px; height: 53px; }
    .skin-card h4, .achievement-card h4 { margin: 0; font-size: .94rem; }
    .skin-card p { min-height: 3.2em; margin: 6px 0 12px; color: #c9cbe3; font-size: .76rem; line-height: 1.6; }
    .skin-card button {
      width: 100%; min-height: 36px; border: 1px solid rgba(255,255,255,.24); border-radius: 9px;
      color: #fff; background: rgba(255,255,255,.08); font-size: .78rem; font-weight: 800;
    }
    .skin-card button:not(:disabled):hover { background: rgba(139, 233, 207, .21); }
    .skin-card button:disabled { cursor: default; opacity: .78; }
    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .achievement-card { display: flex; align-items: flex-start; gap: 11px; padding: 13px; }
    .achievement-card.done { border-color: rgba(255, 226, 148, .43); }
    .achievement-symbol { display: grid; place-items: center; width: 35px; height: 35px; flex: none; border-radius: 10px; background: rgba(255,255,255,.09); font-size: 1rem; }
    .achievement-card.done .achievement-symbol { background: rgba(255, 224, 143, .18); }
    .achievement-card p { margin: 3px 0 0; color: #c9cbe3; font-size: .76rem; line-height: 1.55; }
    .achievement-card small { display: block; margin-top: 5px; color: #a8ebd5; font-size: .72rem; }
    .progress-track { overflow: hidden; height: 4px; margin-top: 9px; border-radius: 4px; background: rgba(255,255,255,.12); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffe18d, #7de2c6); }
    .footer { padding: 18px 5px 0; color: #a8abc7; font-size: .77rem; }
    .footer p { margin: 0; }
    @media (max-width: 760px) {
      .app { width: min(calc(100% - 20px), 540px); padding-top: 14px; }
      .topbar { gap: 8px; margin-bottom: 14px; }
      .brand { gap: 9px; }
      .brand-mark { width: 40px; height: 40px; border-radius: 12px; }
      .brand-mark img { width: 40px; height: 40px; }
      .eyebrow { font-size: .56rem; }
      .icon-btn { padding: 0 10px; font-size: .82rem; min-height: 35px; }
      .game-card { border-radius: 20px; }
      .stage { height: clamp(390px, 59vh, 510px); }
      .scoreboard { top: 12px; left: 11px; right: 11px; gap: 5px; }
      .score-chip { min-width: 72px; padding: 7px 9px; border-radius: 10px; }
      .score-chip strong { font-size: 1rem; }
      .score-chip small { font-size: .62rem; }
      .speed-chip { min-width: 67px; }
      .skill-badge { top: 77px; right: 11px; min-width: 122px; padding: 6px 9px; font-size: .69rem; }
      .scene-badge { top: 77px; left: 11px; padding: 6px 9px; font-size: .69rem; }
      .overlay { padding: 70px 15px 25px; }
      .game-tools { padding: 10px; }
      .hint { display: none; }
      .controls { display: flex; }
      .control { gap: 3px; min-height: 54px; font-size: .82rem; }
      .collection { margin-top: 16px; padding: 17px; border-radius: 19px; }
      .skin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .skin-card { padding: 11px; }
      .achievement-grid { grid-template-columns: 1fr; }
      .footer { line-height: 1.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/prism-dino.svg" alt=""></div>
        <div><p class="eyebrow">PRISM SPRINT</p><h1>虹光衝刺</h1></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="soundButton" type="button" aria-pressed="true">♫ 音效開啟</button>
        <button class="icon-btn" id="pauseButton" type="button" disabled>暫停</button>
      </div>
    </header>

    <section class="game-card" aria-label="彩虹小恐龍遊戲">
      <div class="stage" id="stage">
        <canvas id="gameCanvas" tabindex="0" aria-label="遊戲畫面，按空白鍵跳躍，按住下方向鍵蹲下"></canvas>
        <div class="scoreboard" aria-label="遊戲分數">
          <div class="score-chip"><small>目前分數</small><strong id="score">0000</strong></div>
          <div class="score-chip"><small>最高分</small><strong id="best">0000</strong></div>
          <div class="score-chip speed-chip"><small>速度</small><strong id="speed">×1.0</strong></div>
        </div>
        <div class="scene-badge" aria-live="polite">場景 · <span id="sceneName">暮光原野</span></div>
        <div class="skill-badge ready" id="skillStatus">技能已就緒 · Shift／X</div>
        <div class="toast" id="achievementToast" role="status" aria-live="polite" hidden></div>
        <div class="overlay" id="overlay" aria-live="polite">
          <div class="modal">
            <span class="modal-icon" id="modalIcon" aria-hidden="true">🌈</span>
            <h2 id="modalTitle">準備好出發了嗎？</h2>
            <p id="modalDescription">跳過地面障礙、蹲下閃開低空障礙，穿越四個場景。</p>
            <div class="final-score" id="finalScore" hidden>
              <div><span>本次分數</span><strong id="runScore">0</strong></div>
              <div><span>最高分</span><strong id="runBest">0</strong></div>
            </div>
            <button class="primary" id="mainButton" type="button">開始遊戲 →</button>
          </div>
        </div>
      </div>
      <div class="game-tools">
        <p class="hint"><kbd>空白鍵</kbd>／<kbd>↑</kbd> 跳躍　·　按住 <kbd>↓</kbd> 蹲下　·　<kbd>Shift</kbd>／<kbd>X</kbd> 技能　·　<kbd>P</kbd> 暫停</p>
        <div class="controls" aria-label="觸控操作">
          <button class="control" id="duckButton" type="button" aria-label="按住蹲下">↓ 蹲下</button>
          <button class="control" id="skillButton" type="button" aria-label="發動技能">✦ 技能</button>
          <button class="control" id="jumpButton" type="button" aria-label="跳躍">↑ 跳躍</button>
        </div>
      </div>
    </section>
    <section class="collection" aria-labelledby="collectionTitle">
      <div class="collection-head"><h2 id="collectionTitle">收藏圖鑑</h2><p>完成挑戰，解鎖新的小恐龍與主動技能。</p></div>
      <h3>角色造型</h3>
      <div class="skin-grid" id="skinGrid"></div>
      <h3>七個成就</h3>
      <div class="achievement-grid" id="achievementGrid"></div>
      <p class="collection-note" id="collectionNote">選擇造型後，從下一局開始使用；所有造型共用最高分。</p>
    </section>
    <footer class="footer"><p>每 500 分切換場景；右側的 ↑／↓ 提示下一個障礙。</p></footer>
  </main>

  <audio id="milestoneSound" preload="auto" src="assets/90s-game-ui.mp3"></audio>
  <audio id="hitSound" preload="auto" src="assets/negative_beeps.mp3"></audio>
  <script src="game.js" defer></script>
</body>
</html>
